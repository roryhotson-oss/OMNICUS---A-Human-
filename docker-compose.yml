# OMNICUS Ultimate - Complete Docker Configuration
# Production-ready Docker setup with all services

version: '3.8'

services:
 # ===========================================
 # OMNICUS Core Services
 # ===========================================
 
 # Main OMNICUS Orchestrator
 omnicus-main:
 build:
 context: .
 dockerfile: Dockerfile
 container_name: omnicus-main
 restart: unless-stopped
 ports:
 - "8000:8000" # Dashboard API
 - "8080:8080" # Web Dashboard
 environment:
 - TRADING_MODE=${TRADING_MODE:-simulation}
 - STARTING_CAPITAL=${STARTING_CAPITAL:-10000}
 - BINANCE_API_KEY=${BINANCE_API_KEY}
 - BINANCE_API_SECRET=${BINANCE_API_SECRET}
 - BINANCE_TESTNET=${BINANCE_TESTNET:-true}
 - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
 - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
 - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
 volumes:
 - ./data:/app/data
 - ./logs:/app/logs
 - ./.env:/app/.env:ro
 networks:
 - omnicus-network
 depends_on:
 - redis
 - postgres
 healthcheck:
 test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
 interval: 30s
 timeout: 10s
 retries: 3

 # Telegram Bot Service
 omnicus-telegram:
 build:
 context: .
 dockerfile: Dockerfile
 container_name: omnicus-telegram
 restart: unless-stopped
 environment:
 - SERVICE_MODE=telegram
 - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
 - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
 - ENABLE_VOICE_CALLS=${ENABLE_VOICE_CALLS:-true}
 volumes:
 - ./data:/app/data
 - ./logs:/app/logs
 networks:
 - omnicus-network
 depends_on:
 - omnicus-main

 # Trading Engine
 omnicus-trader:
 build:
 context: .
 dockerfile: Dockerfile
 container_name: omnicus-trader
 restart: unless-stopped
 environment:
 - SERVICE_MODE=trader
 - TRADING_MODE=${TRADING_MODE:-simulation}
 - BINANCE_API_KEY=${BINANCE_API_KEY}
 - BINANCE_API_SECRET=${BINANCE_API_SECRET}
 volumes:
 - ./data:/app/data
 - ./logs:/app/logs
 networks:
 - omnicus-network
 depends_on:
 - omnicus-main
 - redis

 # ===========================================
 # Supporting Services
 # ===========================================

 # Redis for caching and real-time data
 redis:
 image: redis:7-alpine
 container_name: omnicus-redis
 restart: unless-stopped
 ports:
 - "6379:6379"
 volumes:
 - redis-data:/data
 networks:
 - omnicus-network
 healthcheck:
 test: ["CMD", "redis-cli", "ping"]
 interval: 10s
 timeout: 5s
 retries: 5

 # PostgreSQL for trade history and analytics
 postgres:
 image: postgres:15-alpine
 container_name: omnicus-postgres
 restart: unless-stopped
 environment:
 - POSTGRES_USER=omnicus
 - POSTGRES_PASSWORD=${DB_PASSWORD:-omnicus_secure}
 - POSTGRES_DB=omnicus_db
 ports:
 - "5432:5432"
 volumes:
 - postgres-data:/var/lib/postgresql/data
 networks:
 - omnicus-network
 healthcheck:
 test: ["CMD-SHELL", "pg_isready -U omnicus"]
 interval: 10s
 timeout: 5s
 retries: 5

 # ===========================================
 # Monitoring
 # ===========================================

 # Prometheus for metrics
 prometheus:
 image: prom/prometheus:latest
 container_name: omnicus-prometheus
 restart: unless-stopped
 ports:
 - "9090:9090"
 volumes:
 - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
 networks:
 - omnicus-network

 # Grafana for dashboards
 grafana:
 image: grafana/grafana:latest
 container_name: omnicus-grafana
 restart: unless-stopped
 ports:
 - "3000:3000"
 environment:
 - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
 volumes:
 - grafana-data:/var/lib/grafana
 networks:
 - omnicus-network
 depends_on:
 - prometheus

networks:
 omnicus-network:
 driver: bridge

volumes:
 redis-data:
 postgres-data:
 grafana-data:
