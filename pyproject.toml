[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnicus"
version = "1.0.0"
description = "OMNICUS - AI Trading Agent with Soul, Brain, and Human-like Instincts"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "OMNICUS Team", email = "omnicus@example.com"}
]
maintainers = [
    {name = "OMNICUS Team", email = "omnicus@example.com"}
]
keywords = [
    "trading",
    "ai",
    "crypto",
    "bot",
    "binance",
    "polymarket",
    "meme-coins",
    "algorithmic-trading"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed"
]
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "aiohttp>=3.9.0",
    "websockets>=12.0",
    "httpx>=0.26.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-telegram-bot>=21.0",
    "python-binance>=1.0.19",
    "ccxt>=4.2.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "twilio>=8.0.0",
    "openai>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0"
]
full = [
    "redis>=5.0.0",
    "asyncpg>=0.29.0",
    "ta-lib>=0.4.28"
]

[project.scripts]
omnicus = "omnicus.main:main"

[project.urls]
Homepage = "https://github.com/omnicus-ai/omnicus"
Documentation = "https://github.com/omnicus-ai/omnicus#readme"
Repository = "https://github.com/omnicus-ai/omnicus.git"
Issues = "https://github.com/omnicus-ai/omnicus/issues"
Discord = "https://discord.gg/omnicus"

[tool.setuptools.packages.find]
where = ["."]
include = ["omnicus*", "agent*", "api*", "connectors*"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
